name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: 0.15.2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libssl-dev libzstd-dev libcurl4-openssl-dev zlib1g-dev pkg-config

    - name: Build
      run: zig build

    - name: Test
      run: zig build test
